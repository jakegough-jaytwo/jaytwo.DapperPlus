services:

  postgres-localdev:
    build:
      context: ./db
      dockerfile: Dockerfile.postgres
    restart: always
    profiles:
      - "localdev"
    ports:
      - 55432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql-localdev:
    build:
      context: ./db
      dockerfile: Dockerfile.mysql
    restart: always
    profiles:
      - "localdev"
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  sqlserver-localdev:
    build:
      context: ./db
      dockerfile: Dockerfile.sqlserver
    restart: always
    profiles:
      - "localdev"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -C -U sqluser -P sqlpass -l 1 -Q 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile.postgres
    profiles:
      - "testernet"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    build:
      context: ./db
      dockerfile: Dockerfile.mysql
    profiles:
      - "testernet"
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  sqlserver:
    build:
      context: ./db
      dockerfile: Dockerfile.sqlserver
    profiles:
      - "testernet"
    expose:
      - "1433"
    healthcheck:
      test: ["CMD-SHELL", "sqlcmd -S localhost -C -U sqluser -P sqlpass -l 1 -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
